spring.application.name=hostel-allocation

# Default to H2 in-memory DB for immediate, zero-friction local development & Postman testing
# To connect to MySQL: run with --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:hostel_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080

